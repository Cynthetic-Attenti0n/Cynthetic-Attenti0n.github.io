<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Risk of Bias by DC</title>
    <link rel="stylesheet" href="styles.css">
    <script type="importmap">
        {
            "imports": {
                "marked": "https://cdn.jsdelivr.net/npm/marked@10.0.0/+esm",
                "dompurify": "https://cdn.jsdelivr.net/npm/dompurify@3.0.6/+esm",
                "highlight.js": "https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/+esm"
            }
        }
    </script>
</head>
<body>
    <div class="app-container">
        <header>
            <div class="logo">
                <svg viewBox="0 0 24 24" width="32" height="32">
                    <path fill="currentColor" d="M14,3V5H17.59L7.76,14.83L9.17,16.24L19,6.41V10H21V3M19,19H5V5H12V3H5C3.89,3 3,3.9 3,5V19A2,2 0 0,0 5,21H19A2,2 0 0,0 21,19V12H19V19Z" />
                </svg>
                <h1>Risk of Bias by DC</h1>
            </div>
            <div class="upload-container">
                <button id="upload-btn" class="primary-btn">
                    <svg viewBox="0 0 24 24" width="20" height="20">
                        <path fill="currentColor" d="M9,16V10H5L12,3L19,10H15V16H9M5,20V18H19V20H5Z" />
                    </svg>
                    Upload MD File
                </button>
                <input type="file" id="file-upload" accept=".md" multiple hidden>
            </div>
        </header>
        
        <main>
            <div class="view-toggle">
                <button id="grid-view-btn" class="active">
                    <svg viewBox="0 0 24 24" width="20" height="20">
                        <path fill="currentColor" d="M3,3H11V11H3V3M3,13H11V21H3V13M13,3H21V11H13V3M13,13H21V21H13V13Z" />
                    </svg>
                </button>
                <button id="list-view-btn">
                    <svg viewBox="0 0 24 24" width="20" height="20">
                        <path fill="currentColor" d="M3,4H21V8H3V4M3,10H21V14H3V10M3,16H21V20H3V16Z" />
                    </svg>
                </button>
            </div>
            
            <div id="library" class="grid-view">
                <!-- MD files will be displayed here -->
                <div class="empty-state">
                    <svg viewBox="0 0 24 24" width="64" height="64">
                        <path fill="currentColor" d="M13,9H18.5L13,3.5V9M6,2H14L20,8V20A2,2 0 0,1 18,22H6C4.89,22 4,21.1 4,20V4C4,2.89 4.89,2 6,2M15,18V16H6V18H15M18,14V12H6V14H18Z" />
                    </svg>
                    <p>No files yet. Upload your first Markdown file!</p>
                </div>
            </div>
        </main>
         
        <div id="md-viewer" class="hidden">
            <div class="viewer-header">
                <button id="back-btn">
                    <svg viewBox="0 0 24 24" width="24" height="24">
                        <path fill="currentColor" d="M20,11V13H8L13.5,18.5L12.08,19.92L4.16,12L12.08,4.08L13.5,5.5L8,11H20Z" />
                    </svg>
                    Back to Library
                </button>
                <h2 id="viewer-title">Document Title</h2>
            </div>
            <div id="md-content"></div>
        </div>
    </div>
    
    <div id="toast" class="toast hidden">
        <span id="toast-message"></span>
    </div>
    
    <script src="config.js" type="module"></script>
    <script src="app.js" type="module"></script>
</body>
</html>
